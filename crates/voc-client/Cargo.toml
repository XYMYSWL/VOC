[package]
name = "voc-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
voc-proto = { path = "../voc-proto" }
serde.workspace = true
serde_json.workspace = true
eframe = { version = "0.37", features = ["persistence"] }
cpal = "0.18"
nnnoiseless = { version = "0.5.2", default-features = false }
libloading = "0.9.1"
opus = "0.4"
# 打开 Opus 1.5 的 DRED（深度冗余，语音抗丢包），opus 这个封装库会一起用上
opusic-sys = { version = "0.7", features = ["dred"] }
socket2 = { version = "0.6", features = ["all"] }
openh264 = "0.9"
windows-capture = "2"
igd-next = "0.18"
png = "0.18"
windows = { version = "0.62", features = ["Win32_Security_Cryptography", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Variant", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D", "Win32_Storage_Packaging_Appx", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_Time", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_Media_KernelStreaming", "Win32_Media_Multimedia", "Win32_UI_Input_KeyboardAndMouse", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WiFi", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Foundation", "ApplicationModel", "ApplicationModel_Activation", "UI_Notifications", "Data_Xml_Dom", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
sha2 = "0.11"
windows-core = "0.62"
tray-icon = "0.21"
sonora = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
arboard = { version = "3", default-features = false, features = ["image-data"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[dev-dependencies]
pollster = "1"
