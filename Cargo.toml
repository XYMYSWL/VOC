[workspace]
resolver = "2"
members = ["crates/voc-proto", "crates/voc-server", "crates/voc-client", "crates/voc-setup", "crates/voc-denoise-example"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/XYMYSWL/VOC"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
